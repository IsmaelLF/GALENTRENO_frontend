<!DOCTYPE html>

    <style>

        margin-top: 0;
      }
      header[data-astro-cid-3ef6ksr2] {
        background-color: #fff;
        box-shadow: 0 2px 4px #0000001a;
      }
      nav[data-astro-cid-3ef6ksr2] {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }
      .logo[data-astro-cid-3ef6ksr2] {
        font-weight: 700;
        font-size: 1.5rem;
        color: #091e42;
        text-decoration: none;
      }
      .nav-links[data-astro-cid-3ef6ksr2] {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 1.5rem;
      }
      .nav-links[data-astro-cid-3ef6ksr2] a[data-astro-cid-3ef6ksr2] {
        text-decoration: none;
        color: #5e6c84;
        font-weight: 600;
      }
      body {
        font-family: BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
        background-color: #f4f5f7;
        margin: 0;
        color: #172b4d;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        text-align: center;
      }
      h2 {
        font-size: 1.2rem;
        font-weight: 500;
        margin-top: 2rem;
        margin-bottom: 1rem;
        color: #5e6c84;
      }
      small {
        color: #5e6c84;
        font-weight: 500;
      }
      .card {
        background-color: #fff;
        padding: 1rem;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 6px #0000000d;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .card strong {
        font-size: 1.5rem;
        display: block;
        margin-bottom: 0.25rem;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

      }
      .button {

        border-radius: 10px;

        font-weight: 600;
        cursor: pointer;
        text-align: center;
        display: block;
        text-decoration: none;
      }
      .button-register,
      .button-login {
        background-color: #24457f;
        color: #fff;
        width: 20%;
      }
      a {
        color: #fff;
        text-decoration: none;
      }
      .session-item {
        background-color: #fff;
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 0.75rem;
        box-shadow: 0 4px 6px #0000000d;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      label {
        font-weight: 600;
        color: #172b4d;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin: 0 auto;
        width: 40%;
      }
      .plans-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }
      .plan-card {
        background-color: #112f63;
        color: #fff;
        padding: 1rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px #0000000d;
        border: 1px solid rgba(0, 0, 0, 0.05);
        text-decoration: none;
        display: block;
      }
      .plan-card h3 {
        margin-top: 0;
      }
      label {
        font-weight: 600;
        color: #172b4d;
        display: block;
        margin-bottom: 0.25rem;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"],
      select {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: 1px solid #dfe1e6;
        font-size: 1rem;
        font-family: inherit;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus,
      input[type="number"]:focus,
      select:focus {
        outline: none;
        border-color: #112f63;
        box-shadow: 0 0 0 3px #112f631a;
      }
    </style>
  </head>
  <body>
    <header data-astro-cid-3ef6ksr2>
      <nav data-astro-cid-3ef6ksr2>
        <a href="/inicio" class="logo" data-astro-cid-3ef6ksr2>
          <img
            src="/img/logo.png"
            alt="Logo"
            style="width: 150px; height: 150px; display: block"
            data-astro-cid-3ef6ksr2
          />
        </a>
        <ul class="nav-links" data-astro-cid-3ef6ksr2>
          <li data-astro-cid-3ef6ksr2>
            <a href="/inicio" data-astro-cid-3ef6ksr2>Inicio</a>
          </li>
          <li data-astro-cid-3ef6ksr2>
            <a href="/plans" data-astro-cid-3ef6ksr2>Plans</a>
          </li>
          <li data-astro-cid-3ef6ksr2>
            <a href="#" id="logout-link" data-astro-cid-3ef6ksr2
              >Pechar Sesión</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <script type="module">
      const e = document.getElementById("logout-link");
      e &&
        e.addEventListener("click", (t) => {
          t.preventDefault(),
            localStorage.removeItem("jwt_token"),
            (window.location.href = "/");
        });
    </script>
    <h2 data-astro-cid-5m2ew4eq>Os Meus Plans</h2>
    <a
      href="/plans/novo"
      class="button button-primary"
      style="margin-bottom: 1.5rem"
      data-astro-cid-5m2ew4eq
    >
      + Crear Novo Plan
    </a>
    <p data-astro-cid-5m2ew4eq>
      Selecciona un plan para comezar o teu adestramento.
    </p>
    <div id="plans-list" class="plans-container" data-astro-cid-5m2ew4eq>
      <p data-astro-cid-5m2ew4eq>Cargando plans...</p>
    </div>
    <script type="module">
      const apiUrl = undefined;

      document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("jwt_token");
        if (!token) {
          window.location.href = "/";
          return;
        }

        const plansList = document.getElementById("plans-list");

        try {
          const response = await fetch(`${apiUrl}/api/plans/creados`, {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!response.ok) throw new Error("Non se puideron cargar os plans");
          if (!plansList) return;
          const plans = await response.json();
          plansList.innerHTML = "";

          if (plans.length === 0) {
            plansList.innerHTML =
              "<p>Aínda non creaches ningún plan persoal.</p>";
          } else {
            plans.forEach((plan) => {
              const card = document.createElement("div");
              card.className = "plan-card";
              // TODO: Engadir para ver os exercicios tamen
              card.innerHTML = `
                            <h3>${plan.nome}</h3>
                            <p>${plan.descricion || "Sen descrición."}</p>
                        `;
              plansList.appendChild(card);
            });
          }
        } catch (error) {
          console.error("Error:", error);
          if (!plansList) return;
          plansList.innerHTML = "<p>Erro ao cargar os teus plans.</p>";
        }
      });
    </script>
  </body>
</html>
